<body>
  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"><rect width="200" height="200" fill="#f3f2f2"></rect><rect x="60" y="92" width="80" height="5" fill="#201e1d"></rect><text x="100" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#201e1d">هـ</text><circle cx="100" cy="128" r="8" fill="#d6006c"></circle></svg></div>
  <div id="__bundler_loading">جارٍ الفتح…</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('تعذّر العثور على محتوى البطاقة');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('جارٍ التحضير…');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('لحظة واحدة…');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('تعذّر فتح البطاقة: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-fam u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-rise=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(18px,2.4vw,30px);margin-top:clamp(46px,8vw,110px)\">\n        <h2 style=\"margin:0;font-family:'Amiri',var(--font-heading),serif;font-weight:700;font-size:clamp(34px,6.4vw,84px);line-height:1.72;max-width:22ch;text-wrap:pretty\">كلُّ سنةٍ وأنتِ أجملُ خبرٍ في حياتي<\u002Fh2>\n        <p style=\"margin:0;font-size:clamp(19px,2.2vw,28px);line-height:1.75;max-width:36ch;color:var(--color-neutral-800)\">في مثلِ هذا اليوم صار لقلبي عنوان — واسمه أنتِ.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-rise=\"\" style=\"display:flex;align-items:flex-start;gap:clamp(20px,4vw,64px);margin-top:clamp(56px,9vw,130px);flex-wrap:wrap\">\n        <div style=\"flex:none;width:clamp(96px,13vw,190px)\">\n          <div class=\"cmyk-num\" style=\"font-family:'Amiri',serif;font-weight:700;font-size:clamp(96px,13vw,190px);line-height:.8\">١<\u002Fdiv>\n          <div style=\"margin-top:12px;font-size:13px;word-spacing:.16em;color:var(--color-neutral-600)\">هبوشتي، واحدة<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 320px;min-width:280px;display:flex;flex-direction:column;gap:clamp(14px,1.8vw,22px)\">\n          <div style=\"font-size:12px;word-spacing:.26em;color:var(--spot)\">أوّلُ الكلام<\u002Fdiv>\n          <p style=\"margin:0;font-size:clamp(20px,2.4vw,30px);line-height:1.85;max-width:34ch\">لو كان للفرحِ اسمٌ، لسمّوه بكِ.<br>ولو كان للصباحِ وجهٌ، لكان وجهَكِ.<br>ولو سألوني: أين تسكن؟ — لقلتُ: عندها.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-rise=\"\" style=\"margin-top:clamp(60px,10vw,140px);max-width:30ch\">\n        <p style=\"margin:0;font-style:italic;font-weight:700;font-size:clamp(30px,5.4vw,68px);line-height:1.45;color:var(--spot);text-wrap:pretty\">أنتِ لستِ في قلبي… أنتِ قلبي.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-rise=\"\" style=\"margin-top:clamp(58px,9vw,130px);display:flex;flex-direction:column;gap:clamp(14px,1.6vw,20px);max-width:620px\">\n        <div style=\"font-size:12px;word-spacing:.26em;color:var(--color-accent)\">في هذا العدد<\u002Fdiv>\n        <div style=\"height:1px;background:var(--color-neutral-300)\"><\u002Fdiv>\n        <div style=\"display:grid;gap:clamp(14px,1.6vw,20px)\">\n          <div style=\"display:flex;align-items:baseline;gap:16px;font-size:clamp(18px,2vw,24px)\"><span style=\"color:var(--color-neutral-500);font-size:.72em\">٠١<\u002Fspan><div><div>١٧ فبراير ٢٠٢٦ — يومُ قلتِ نعم<\u002Fdiv><div style=\"font-size:13px;color:var(--color-neutral-600);margin-top:5px\">{{ sinceEngagement }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:16px;font-size:clamp(18px,2vw,24px)\"><span style=\"color:var(--color-neutral-500);font-size:.72em\">٠٢<\u002Fspan><div><div>١ يونيو ٢٠٢٦ — يومُ صار اسمُكِ معي<\u002Fdiv><div style=\"font-size:13px;color:var(--color-neutral-600);margin-top:5px\">{{ sinceWedding }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:16px;font-size:clamp(18px,2vw,24px)\"><span style=\"color:var(--color-neutral-500);font-size:.72em\">٠٣<\u002Fspan><div><div>١٥ أغسطس — يومُكِ أنتِ<\u002Fdiv><div style=\"font-size:13px;color:var(--color-neutral-600);margin-top:5px\">{{ birthdayLine }}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-rise=\"\" style=\"margin-top:clamp(60px,10vw,140px);display:flex;flex-direction:column;gap:clamp(16px,2vw,26px);max-width:640px\">\n        <div style=\"font-size:12px;word-spacing:.26em;color:var(--spot)\">الكلمةُ الأخيرة<\u002Fdiv>\n        <p style=\"margin:0;font-size:clamp(20px,2.3vw,29px);line-height:1.8\">كلُّ عامٍ وأنتِ حبيبتي، وكلُّ عامٍ وأنا أكثرُ يقيناً أنّني اخترتُ صحّ. {{ occasionLine }}<\u002Fp>\n        <p style=\"margin:0;font-family:'Amiri',serif;font-style:italic;font-weight:700;font-size:clamp(28px,4.6vw,56px);line-height:1.5\">بحبّك… دائماً.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-rise=\"\" style=\"margin:clamp(56px,8vw,110px) 0 clamp(40px,7vw,90px);display:flex;align-items:center;gap:18px\">\n        <div style=\"flex:1 1 auto;height:1px;background:var(--color-neutral-300)\"><\u002Fdiv>\n        <div style=\"font-size:12px;word-spacing:.24em;color:var(--color-neutral-600)\">طُوِيَ هذا العدد بيدي<\u002Fdiv>\n        <div style=\"width:9px;height:9px;background:var(--spot);border-radius:50%\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div ref=\"{{ coverRef }}\" style=\"position:absolute;inset:0;z-index:6;pointer-events:{{ coverPointer }};background:var(--color-bg);transform-origin:50% 0%;transform:{{ coverTransform }};opacity:{{ coverOpacity }};transition:transform 1.15s cubic-bezier(.72,-0.02,.2,1), opacity .7s ease .45s;box-shadow:0 30px 80px rgba(32,30,29,.16);display:flex;overflow-y:auto;overscroll-behavior:contain;padding:clamp(18px,min(6vw,4vh),80px)\">\n    <div style=\"position:absolute;top:22px;right:22px;width:26px;height:26px;border-top:1px solid var(--color-accent);border-right:1px solid var(--color-accent)\"><\u002Fdiv>\n    <div style=\"position:absolute;bottom:22px;left:22px;width:26px;height:26px;border-bottom:1px solid var(--color-accent-2);border-left:1px solid var(--color-accent-2)\"><\u002Fdiv>\n\n    <div style=\"margin:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,min(3vw,2.4vh),34px);text-align:center;animation:hb-fade 1s ease both\">\n      <div style=\"font-size:12px;word-spacing:.34em;color:var(--color-neutral-600)\">إلى هبوشتي · وحدَها<\u002Fdiv>\n      <div style=\"width:56px;height:4px;background:var(--color-text)\"><\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Amiri',serif;font-weight:700;font-size:clamp(34px,min(9vw,11vh),110px);line-height:1.62\">{{ coverTitle }}<\u002Fh2>\n      <div style=\"font-size:clamp(13px,3.2vw,16px);color:var(--spot);word-spacing:.2em\">{{ firstBirthday }}<\u002Fdiv>\n      <p style=\"margin:0;font-style:italic;font-size:clamp(15px,min(2.2vw,2.6vh),26px);color:var(--color-neutral-700);max-width:26ch;line-height:2;text-wrap:pretty\">{{ coverDeck }}<\u002Fp>\n      <sc-if value=\"{{ unlocked }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onOpen }}\" style=\"margin-top:6px;min-height:52px;font-family:'Amiri',serif;font-size:clamp(18px,1.9vw,22px);font-weight:700;color:#fff;background:var(--spot);border:none;border-radius:var(--radius-sm,2px);padding:14px 34px;cursor:pointer;word-spacing:.1em;animation:hb-seal 2.6s ease-in-out infinite\" style-hover=\"background:var(--color-accent-700)\" style-active=\"transform:scale(.97)\">{{ openLabel }}<\u002Fbutton>\n          <div style=\"font-size:12px;word-spacing:.2em;color:var(--color-neutral-500);animation:hb-drift 1.6s ease-in-out infinite alternate\">ثمّ مرّري للأسفل<\u002Fdiv>\n          <div style=\"font-size:12px;word-spacing:.16em;color:var(--color-neutral-500)\">ويفضَّل تشغيل الصوت 🎧<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vw,24px);width:100%\">\n          <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2.4vw,22px);direction:ltr;max-width:100%\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 clamp(58px,16vw,86px)\">\n              <div style=\"font-family:'Amiri',serif;font-weight:700;font-size:clamp(28px,min(9vw,7.5vh),58px);line-height:1;white-space:nowrap;color:var(--color-text)\">{{ cdDays }}<\u002Fdiv>\n              <div style=\"font-size:11px;word-spacing:.18em;color:var(--color-neutral-600)\">يوم<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 clamp(58px,16vw,86px)\">\n              <div style=\"font-family:'Amiri',serif;font-weight:700;font-size:clamp(28px,min(9vw,7.5vh),58px);line-height:1;white-space:nowrap;color:var(--color-text)\">{{ cdHours }}<\u002Fdiv>\n              <div style=\"font-size:11px;word-spacing:.18em;color:var(--color-neutral-600)\">ساعة<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 clamp(58px,16vw,86px)\">\n              <div style=\"font-family:'Amiri',serif;font-weight:700;font-size:clamp(28px,min(9vw,7.5vh),58px);line-height:1;white-space:nowrap;color:var(--color-text)\">{{ cdMins }}<\u002Fdiv>\n              <div style=\"font-size:11px;word-spacing:.18em;color:var(--color-neutral-600)\">دقيقة<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 clamp(58px,16vw,86px)\">\n              <div style=\"font-family:'Amiri',serif;font-weight:700;font-size:clamp(28px,min(9vw,7.5vh),58px);line-height:1;white-space:nowrap;color:var(--spot)\">{{ cdSecs }}<\u002Fdiv>\n              <div style=\"font-size:11px;word-spacing:.18em;color:var(--color-neutral-600)\">ثانية<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:clamp(13px,3.4vw,15px);word-spacing:.16em;color:var(--color-neutral-600);text-align:center\">{{ opensOn }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:clamp(9px,1.6vw,13px);max-width:clamp(240px,78vw,420px);margin-top:clamp(6px,1.8vw,16px);animation:hb-fade .7s ease .8s both\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <div style=\"width:28px;height:1px;background:var(--color-neutral-300)\"><\u002Fdiv>\n          <div style=\"font-size:12px;word-spacing:.34em;color:var(--color-neutral-700)\">صفحةُ اليوم · {{ themeName }}<\u002Fdiv>\n          <div style=\"width:28px;height:1px;background:var(--color-neutral-300)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'Amiri',serif;font-weight:700;font-size:clamp(20px,min(5vw,4.5vh),30px);line-height:1.5;color:var(--spot)\">{{ todayValue }}<\u002Fdiv>\n        <div style=\"font-family:'Amiri',serif;font-size:clamp(15px,min(4.2vw,2.7vh),22px);line-height:2;color:var(--color-neutral-800);text-align:center;text-wrap:balance\">{{ todayPhrase }}<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-600)\">{{ tomorrowNote }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;previewUnlocked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;القفل&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;الحركة&quot;},&quot;spotAccent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;أرجواني&quot;,&quot;سماوي&quot;],&quot;default&quot;:&quot;سماوي&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;اللون&quot;}}\">\nclass Component extends DCLogic {\n  state = { opened: false, now: Date.now() };\n\n  // ── المناسبات الثلاث: مصدرٌ واحد للحقيقة، والشهر بترقيم جافاسكربت ──\n  occasions() {\n    return [\n      { key: 'engagement', m: 1, d: 17, name: 'ذكرى الخطبة', date: '١٧ فبراير', from: 2026 },\n      { key: 'wedding', m: 5, d: 1, name: 'ذكرى زواجنا', date: '١ يونيو', from: 2026 },\n      { key: 'birthday', m: 7, d: 15, name: 'عيدُ ميلادكِ', date: '١٥ أغسطس', from: null }\n    ];\n  }\n\n  at(o, y) { return new Date(y, o.m, o.d, 0, 0, 0).getTime(); }\n\n  occasionCopy() {\n    return {\n      engagement: {\n        lockedTitle: 'في السابع عشر…',\n        inName: 'ذكرى خطبتنا',\n        openTitle: 'ذكرى أوّلِ نعم',\n        openDeck: 'في مثلِ هذا اليوم قلتِ نعم، فبدأ كلُّ شيء.',\n        button: 'افتحي العدد',\n        line: 'ذكرى خِطبتنا ليست يوماً في التقويم — إنّها اليومُ الذي بدأ فيه كلُّ ما بعدَه.'\n      },\n      wedding: {\n        lockedTitle: 'في الأوّلِ من يونيو…',\n        inName: 'ذكرى زواجنا',\n        openTitle: 'كلُّ عامٍ ونحن معاً',\n        openDeck: 'في مثلِ هذا اليوم صار اسمُكِ معي، فلم أعُد أُحصي البدايات.',\n        button: 'افتحي العدد',\n        line: 'ذكرى زواجنا ليست يوماً في التقويم — إنّها اليومُ الذي صار لي فيه بيت.'\n      },\n      birthday: {\n        lockedTitle: 'قريباً جدّاً…',\n        inName: 'عيدِ ميلادكِ',\n        openTitle: 'عيد ميلاد سعيد',\n        openDeck: 'عددٌ خاصٌّ صدر لكِ اليوم. اقرئيه على مَهَل، ثمَّ عودي غداً — الصفحةُ تتبدَّل.',\n        button: 'افتحي البطاقة',\n        line: 'عيدُ ميلادكِ ليس يوماً في التقويم — إنه اليومُ الذي أشكرُ فيه العالمَ كلَّه.'\n      }\n    };\n  }\n\n  // صياغة تصحُّ في كل النطاقات: ١، ٢، ٣–١٠، ١١ فما فوق.\n  ar(n) { return String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]); }\n\n  // مطابقة تمييز العدد: الحكم على الخانتين الأخيرتين، لا على العدد كلِّه.\n  countPhrase(n, one, two, few, many, other) {\n    const r = n % 100;\n    if (n === 1) return one;\n    if (n === 2) return two;\n    if (r >= 3 && r <= 10) return this.ar(n) + few;\n    if (r >= 11 && r <= 99) return this.ar(n) + many;\n    return this.ar(n) + other;\n  }\n\n  arDays(n) {\n    if (n <= 0) return 'اليومَ';\n    return this.countPhrase(n, 'يومٌ واحد', 'يومان', ' أيّامٍ', ' يوماً', ' يومٍ');\n  }\n\n  daysSince(key) {\n    const o = this.occasions().find(x => x.key === key);\n    if (!o || !o.from) return null;\n    return Math.max(0, this.dayIndex() - this.dayNum(new Date(this.at(o, o.from))));\n  }\n\n  daysUntil(key) {\n    const o = this.occasions().find(x => x.key === key);\n    const y = new Date(this.state.now).getFullYear();\n    const today = this.dayIndex();\n    for (const yy of [y, y + 1]) {\n      const n = this.dayNum(new Date(this.at(o, yy))) - today;\n      if (n >= 0) return n;\n    }\n    return 0;\n  }\n\n  // أقرب مناسبة اليومَ أو بعده — تتخطّى رأس السنة من تلقائها.\n  nextOccasion() {\n    const y = new Date(this.state.now).getFullYear();\n    const today = this.dayIndex();\n    let best = null;\n    for (const o of this.occasions()) {\n      for (const yy of [y, y + 1]) {\n        const t = this.at(o, yy);\n        if (this.dayNum(new Date(t)) >= today) {\n          if (!best || t < best.t) best = { o, t, y: yy };\n          break;\n        }\n      }\n    }\n    return best;\n  }\n\n  // آخر مناسبة مضت أو حلَّت اليوم — وهي «العدد الجاري».\n  currentIssue() {\n    const y = new Date(this.state.now).getFullYear();\n    const today = this.dayIndex();\n    let best = null;\n    for (const o of this.occasions()) {\n      for (const yy of [y, y - 1]) {\n        const t = this.at(o, yy);\n        if (this.dayNum(new Date(t)) <= today) {\n          if (!best || t > best.t) best = { o, t, y: yy };\n          break;\n        }\n      }\n    }\n    return best;\n  }\n\n  target() { return this.nextOccasion().t; }\n  rootRef = React.createRef();\n  coverRef = React.createRef();\n  scrollRef = React.createRef();\n\n  componentDidMount() {\n    this.applyTheme();\n    this.applySpot();\n    this.paintChrome(this.dayTheme().bg);\n    this.applyInert();\n    this.restoreOpened();\n    this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);\n  }\n  // الغلاف والبطاقة شقيقان يبقيان معاً في الشجرة، فالقفل بصريّ فقط:\n  // بدون هذا يقرأ VoiceOver الرسالة كاملةً قبل الخامس عشر.\n  storeKey(i) {\n    const cur = i || this.currentIssue();\n    return cur ? 'mylove-opened-' + cur.o.key + '-' + cur.y : 'mylove-opened-none';\n  }\n\n  openedFlag(i) {\n    try { return localStorage.getItem(this.storeKey(i)) === '1'; } catch (e) { return false; }\n  }\n\n  // iOS يُخلي التبويب الخلفيّ تحت ضغط الذاكرة. بدون هذا تعود إلى الغلاف\n  // كأنّها لم تفتحها قطّ — وهو ما ينقض وعد «مرَّةً واحدة» بدل أن يحقّقه.\n  restoreOpened() {\n    if (!this.isUnlocked() || !this.openedFlag()) return;\n    this.setState({ opened: true }, () => {\n      this.applyInert();\n      const cover = this.coverRef.current;\n      if (cover) { cover.style.transition = 'none'; cover.style.visibility = 'hidden'; }\n      const root = this.scrollRef.current;\n      if (root) root.querySelectorAll('[data-rise]').forEach(el => {\n        el.style.opacity = '1'; el.style.transform = 'none';\n      });\n    });\n  }\n\n  applyInert() {\n    const opened = this.state.opened;\n    const cover = this.coverRef.current;\n    const scroll = this.scrollRef.current;\n    if (cover) {\n      cover.inert = opened;\n      cover.setAttribute('aria-hidden', opened ? 'true' : 'false');\n    }\n    if (scroll) {\n      scroll.inert = !opened;\n      scroll.setAttribute('aria-hidden', opened ? 'false' : 'true');\n    }\n  }\n\n  componentWillUnmount() { clearInterval(this.timer); }\n  componentDidUpdate(prev) {\n    if (prev !== this.props) this.applySpot();\n    if (this.dayIndex() !== this.themeKey) { this.themeKey = this.dayIndex(); this.applyTheme(); }\n    this.paintChrome(this.state.opened ? '#f3f2f2' : this.dayTheme().bg);\n  }\n\n  applySpot() {\n    const root = this.rootRef.current;\n    if (!root) return;\n    const spot = (this.props.spotAccent ?? \"سماوي\") === \"سماوي\" ? \"var(--color-accent)\" : \"var(--color-accent-2)\";\n    root.style.setProperty(\"--spot\", spot);\n  }\n\n  open = () => {\n    if (this.state.opened || !this.isUnlocked()) return;\n    // لا نكتب العَلَم في وضع المعاينة، وإلّا بقيت البطاقة مفتوحةً بعدها.\n    if (this.props.previewUnlocked !== true) {\n      try { localStorage.setItem(this.storeKey(), '1'); } catch (e) {}\n    }\n    this.setState({ opened: true }, () => {\n      this.applyInert();\n      setTimeout(() => this.reveal(), 700);\n      setTimeout(() => {\n        const cover = this.coverRef.current;\n        if (cover) cover.style.visibility = 'hidden';\n        const scroll = this.scrollRef.current;\n        if (scroll) { scroll.tabIndex = -1; scroll.focus({ preventScroll: true }); }\n      }, 1250);\n    });\n  };\n\n  reveal() {\n    const root = this.scrollRef.current;\n    if (!root) return;\n    const els = Array.from(root.querySelectorAll(\"[data-rise]\"));\n    if (this.props.motion === false) { els.forEach(el => { el.style.opacity = \"1\"; el.style.transform = \"none\"; }); return; }\n    // ثبّت حالة الإخفاء أولاً بلا انتقال، ثمّ اسحب التخطيط، ثمّ سلِّح\n    // الانتقال — وإلّا تحرّك الإخفاءُ نفسُه وارتدّ المحتوى بدل أن يصعد.\n    els.forEach(el => {\n      el.style.transition = \"none\";\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(30px)\";\n    });\n    void root.offsetHeight;\n    els.forEach(el => {\n      el.style.transition = \"opacity .95s cubic-bezier(.2,.7,.2,1), transform .95s cubic-bezier(.2,.7,.2,1)\";\n    });\n    const io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        const i = els.indexOf(e.target);\n        setTimeout(() => { e.target.style.opacity = \"1\"; e.target.style.transform = \"none\"; }, i * 90);\n        io.unobserve(e.target);\n      });\n    }, { root, threshold: 0.15 });\n    els.forEach(el => io.observe(el));\n  }\n\n  // مهلة أسبوع بعد المناسبة: انتزاعُ الهديّة صباحَ الغد أسوأ من ألّا تُقفل،\n  // ونسيانُها يومَها لا يجوز أن يُضيّع المناسبة كلَّها. وإن فتحتْها فهي لها\n  // حتى المناسبة التالية.\n  GRACE_DAYS = 7;\n\n  isUnlocked() {\n    if (this.props.previewUnlocked === true) return true;\n    const cur = this.currentIssue();\n    if (!cur) return false;\n    if (this.dayIndex() - this.dayNum(new Date(cur.t)) <= this.GRACE_DAYS) return true;\n    return this.openedFlag(cur);\n  }\n\n  padDays(n) {\n    return String(n).padStart(2, '0')\n      .replace(/[0-9]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[+d]; });\n  }\n\n  pad(n) {\n    return String(n).pad n all[this.dayIndex() % all.length];\n  }\n\n  dayTheme() {\n    const all = this.dayThemes();\n    return all[this.dayIndex() % all.length];\n  }\n\n  pagesLeft() {\n    const n = this.daysLeft();\n    if (n <= 0) return 'وغداً يصدرُ العدد';\n    return 'بقيت ' + this.countPhrase(n, 'صفحةٌ واحدة', 'صفحتان', ' صفحاتٍ', ' صفحةً', ' صفحةٍ');\n  }\n\n  daysLeft() {\n    return Math.max(0, Math.floor((this.target() - this.state.now) / 86400000));\n  }\n\n  // درجة من لون أساس نحو الأبيض أو الأسود، لتوليد الرامب كاملاً.\n  shade(hex, amt, toward) {\n    const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));\n    const from = rgb(hex), to = rgb(toward);\n    return '#' + from\n      .map((v, i) => Math.round(v + (to[i] - v) * amt).toString(16).padStart(2, '0'))\n      .join('');\n  }\n\n  // الثيم يُطبَّق على الغلاف وحدَه؛ البطاقة الداخلية تحتفظ بلوحتها المطبعية.\n  paintChrome(color) {\n    let m = document.head.querySelector('meta[name=theme-color]');\n    if (!m) {\n      m = document.createElement('meta');\n      m.setAttribute('name', 'theme-color');\n      document.head.appendChild(m);\n    }\n    if (m.getAttribute('content') !== color) m.setAttribute('content', color);\n    document.documentElement.style.background = color;\n  }\n\n  applyTheme() {\n    const cover = this.coverRef.current;\n    if (!cover) return;\n    const t = this.dayTheme();\n    if (!t) return;\n    const steps = [[100, .93, 1], [200, .82, 1], [300, .66, 1], [400, .45, 1], [500, .22, 1],\n      [600, 0, 1], [700, .18, 0], [800, .38, 0], [900, .6, 0]];\n    const W = '#ffffff', K = '#000000';\n    cover.style.setProperty('--color-accent', t.a);\n    cover.style.setProperty('--color-accent-2', t.b);\n    cover.style.setProperty('--color-bg', t.bg);\n    cover.style.setProperty('--color-surface', this.shade(t.bg, .07, K));\n    cover.style.background = t.bg;\n    steps.forEach(st => {\n      const to = st[2] ? W : K;\n      cover.style.setProperty('--color-accent' + '-' + st[0], this.shade(t.a, st[1], to));\n      cover.style.setProperty('--color-accent-2' + '-' + st[0], this.shade(t.b, st[1], to));\n    });\n    // ‏--spot يُحسَب على الجذر، فلا يرث ألوان الغلاف؛ نضبطه هنا صراحةً.\n    const sky = (this.props.spotAccent ?? 'سماوي') === 'سماوي';\n    cover.style.setProperty('--spot', sky ? t.a : t.b);\n  }\n\n  renderVals() {\n    const opened = this.state.opened;\n    const unlocked = this.isUnlocked();\n    const nxt = this.nextOccasion();\n    const iss = this.currentIssue();\n    const cc = this.occasionCopy()[nxt.o.key];\n    const left = Math.max(0, this.target() - this.state.now);\n    const s = Math.floor(left / 1000);\n    return {\n      unlocked,\n      locked: !unlocked,\n      cdDays: this.padDays(Math.floor(s / 86400)),\n      cdHours: this.pad(Math.floor((s % 86400) / 3600)),\n      cdMins: this.pad(Math.floor((s % 3600) / 60)),\n      cdSecs: this.pad(s % 60),\n      coverRef: this.coverRef,\n      themeName: this.dayTheme().n,\n      todayValue: this.todayPair().v,\n      todayPhrase: this.todayPair().p,\n      coverTitle: unlocked ? cc.openTitle : cc.lockedTitle,\n      coverDeck: unlocked\n        ? cc.openDeck\n        : 'عددٌ خاصٌّ يصدر لكِ في ' + cc.inName + '، ' + nxt.o.date +\n          '. وحتّى ذلك اليوم، لكِ هنا صفحةٌ كلَّ صباح.',\n      openLabel: cc.button,\n      opensOn: 'يُفتح العدد يوم ' + nxt.o.date,\n      occasionName: iss ? iss.o.name : nxt.o.name,\n      occasionLine: (iss ? this.occasionCopy()[iss.o.key] : cc).line,\n      issueLine: 'اليومُ ' + this.pad(this.daysSince('wedding') ?? 0) + ' من الزواج',\n      firstBirthday: (unlocked && iss && iss.o.key === 'birthday' && iss.y === 2026)\n        ? 'أوّلُ عيدِ ميلادٍ لكِ وأنتِ زوجتي' : '',\n      sinceEngagement: 'مضى عليه ' + this.arDays(this.daysSince('engagement') ?? 0),\n      sinceWedding: 'مضى عليه ' + this.arDays(this.daysSince('wedding') ?? 0),\n      birthdayLine: this.daysUntil('birthday') === 0\n        ? 'اليومَ' : 'بعد ' + this.arDays(this.days   <!-- ═══ موسيقى الخلفية ═══════════════════════════════════════════════════
       The bundler replaces document.documentElement, so anything mounted
       before that is discarded. The Audio object lives on window and never
       enters the DOM, so playback survives untouched; only the toggle button
       is re-mounted.

       Three iOS realities shape this code:
       - The element volume setter is a no-op there. Where that is detected,
         output is routed through a Web Audio gain node, which iOS does honour,
         so the fade is real instead of a full-volume cut-in. The graph is only
         built on that path — createMediaElementSource is irreversible, so
         desktop keeps the proven element-volume route.
       - Playback is armed on 'click', never 'pointerdown', so an attempted
         scroll cannot start the music.
       - The Ring/Silent switch mutes ambient audio invisibly: play() resolves
         and currentTime advances either way. So the UI never claims sound is
         audible, it only ever reports what was asked for.

       Nothing is fetched until she asks for it — the track is 1.9 MB and most
       visits before the 15th will never play it.
  -->
  <script>
  (function () {
    if (window.__bgm) return;

    var SRC = 'bgm.m4a';
    var HOST_ID = '__bgm_host';
    var VOLUME = 0.55;

    var audio = new Audio();
    audio.src = SRC;
    audio.loop = true;
    audio.preload = 'none';
    audio.setAttribute('playsinline', '');
    window.__bgm = audio;

    // Probe the volume setter once. On iOS it silently refuses, and a fade
    // loop waiting for a value that cannot change would never terminate.
    audio.volume = 0.5;
    var canFade = Math.abs(audio.volume - 0.5) < 0.01;
    audio.volume = 1;

    var want = false;   // what she asked for — not what the element reports
    var dead = false;
    var fade = null;
    var ctx = null, gainNode = null;

    function ensureGraph() {
      if (ctx || canFade) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        var c = new AC();
        var src = c.createMediaElementSource(audio);
        var g = c.createGain();
        g.gain.value = 0;
        src.connect(g);
        g.connect(c.destination);
        ctx = c;
        gainNode = g;
      } catch (e) {
        ctx = null;
        gainNode = null;
      }

    function fadeTo(target, done) {
      clearInterval(fade);
      if (gainNode && ctx) {
        gainNode.gain.setTargetAtTime(target, ctx.currentTime, 0.22);
        if (done) setTimeout(done, 700);
        return;
      }
      if (!canFade) { if (done) done(); return; }
      var step = target > audio.volume ? 0.04 : -0.07;
      fade = setInterval(function () {
        var v = audio.volume + step;
        if ((step > 0 && v >= target) || (step < 0 && v <= target)) {
          clearInterval(fade);
          fade = null;
          audio.volume = Math.max(0, Math.min(1, target));
          if (done) done();
        } else {
          audio.volume = Math.max(0, Math.min(1, v));
        }
      }, 40);
    }

    function paint() {
      var btn = document.getElementById('__bgm_btn');
      if (!btn) return;
      var on = want && !audio.paused && !dead;
      btn.classList.toggle('on', on);
      // Describes the request. Whether sound is audible cannot be known.
      var label = on ? 'إيقاف الموسيقى' : 'تشغيل الموسيقى';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');

        // first press of the button reads as "already playing" and stops it.
        want = false;
        paint();
        throw err;
      });

    function stop() {
      want = false;
      fadeTo(0, function () { if (!want) audio.pause(); paint(); });
      paint();

    var EVENTS = ['click', 'keydown'];

      } catch (e) {}
    }

    // Autoplay with sound is refused everywhere, so this only ever succeeds
    // where the visitor has already granted the origin permission.
    play().then(disarm, arm);

    function mount() {
      var host = document.createElement('div');
      host.id = HOST_ID;
      host.innerHTML =
        '<style>' +
        '#__bgm_btn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));' +
        'z-index:2147483000;width:46px;height:46px;' +
        'display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;cursor:pointer;' +
        'background:rgba(255,255,255,.86);color:#6b6764;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);' +
        'box-shadow:0 2px 14px rgba(0,0,0,.13);transition:color .3s,transform .3s,box-shadow .3s;padding:0}' +
        '#__bgm_btn:hover{transform:scale(1.07);box-shadow:0 4px 20px rgba(0,0,0,.18)}' +
        '#__bgm_btn:focus-visible{outline:2px solid #d6006c;outline-offset:3px}' +
        '#__bgm_btn.on{color:#d6006c}' +
        '#__bgm_btn .off{display:none}#__bgm_btn.on .off{display:block}#__bgm_btn.on .idle{display:none}' +
        '#__bgm_btn.on .bar{animation:__bgm_eq .9s ease-in-out infinite}' +
        '#__bgm_btn .bar:nth-child(2){animation-delay:.15s}#__bgm_btn .bar:nth-child(3){animation-delay:.3s}' +
        '@keyframes __bgm_eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}' +
        '@media (prefers-reduced-motion:reduce){#__bgm_btn .bar{animation:none}}' +
        '@media (forced-colors:active){#__bgm_btn{border:2px solid ButtonText;background:ButtonFace}}' +
        '</style>' +
        '<button id="__bgm_btn" type="button" aria-pressed="false" ' +
        'aria-label="تشغيل الموسيقى" title="تشغيل الموسيقى">' +
        '<svg class="idle" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>' +
        '<svg class="off" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor">' +
        '<rect class="bar" x="3.5" y="6" width="3" height="12" rx="1.5" style="transform-origin:5px 12px"/>' +
        '<rect class="bar" x="10.5" y="6" width="3" height="12" rx="1.5" style="transform-origin:12px 12px"/>' +
        '<rect class="bar" x="17.5" y="6" width="3" height="12" rx="1.5" style="transform-origin:19px 12px"/>' +
        '</g></svg></button>';
      document.body.appendChild(host);

      document.getElementById('__bgm_btn').addEventListener('click', function (e) {
        e.stopPropagation();
        // Branch on intent, not audio.paused — mid-fade the element still
        // reports playing, which would invert a quick second tap.
        if (want) stop();
        else play().then(disarm, function () {});
      });
      if (dead) document.getElementById('__bgm_btn').style.display = 'none';
      paint();
    }

    // The document swap discards the button. Watch for it rather than only
    // polling, so it returns within a frame instead of half a second.
    function ensure() { if (document.body && !document.getElementById(HOST_ID)) mount(); }
    try { new MutationObserver(ensure).observe(document, { childList: true }); } catch (e) {}
    setInterval(ensure, 1000);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ensure);
    else ensure();
  })();
  </script>
